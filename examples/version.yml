# Copy to .github/workflows/version.yml in your repo, and set the branch to its default branch.
name: Version

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

jobs:
  check:
    uses: ysasiwat/github-workflows/.github/workflows/version-check.yml@v1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ysasiwat/github-workflows/.github/workflows/release.yml@v1
