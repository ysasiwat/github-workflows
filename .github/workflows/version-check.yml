name: Check version

on:
  workflow_call:
    inputs:
      script:
        description: Path of the version script in the calling repo
        type: string
        default: scripts/version.sh

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash "$SCRIPT" check
        env:
          SCRIPT: ${{ inputs.script }}
