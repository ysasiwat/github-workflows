# This repo calls its own workflows by local path, so a change is tested in the same push.
name: Version

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

jobs:
  check:
    uses: ./.github/workflows/version-check.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      move-major-tag: true
